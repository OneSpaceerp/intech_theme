[project]
name = "intech_theme"
authors = [
    { name = "In Tech", email = "kelshiekh@gmail.com" }
]
description = "In Tech brand theme and white-label layer for Frappe / ERPNext v16"
requires-python = ">=3.10"
readme = "README.md"
license = "MIT"
license-files = ["license.txt"]
dynamic = ["version"]
# frappe is deliberately absent: bench installs and manages it. The supported range is
# declared under [tool.bench.frappe-dependencies], which is what bench reads.
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.flit.module]
name = "intech_theme"

[tool.bench.frappe-dependencies]
frappe = ">=16.51.0,<17.0.0"

[tool.bench.dev-dependencies]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B"]
ignore = ["E501", "W191", "E101"]

[tool.ruff.format]
quote-style = "double"
indent-style = "tab"
